name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
      - main
      - dev
  workflow_dispatch:

# GitHub Pages へのデプロイ権限を設定
permissions:
  contents: read
  pages: write
  id-token: write

# 同時デプロイの競合を防止
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 本番ブランチのチェックアウト
        uses: actions/checkout@v4
        with:
          ref: ${{ (github.ref_name == 'master' || github.ref_name == 'main') && github.sha || github.event.repository.default_branch }}
          path: prod

      - name: Node.js のセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: prod/package-lock.json

      - name: 本番用依存関係のインストールとビルド
        working-directory: prod
        run: |
          npm ci
          npm run build

      - name: 公開用ディレクトリへ本番ビルドを配置
        run: |
          mkdir -p _site
          cp -a prod/dist/. _site/

      - name: dev ブランチの存在確認
        id: check-dev
        working-directory: prod
        run: |
          if git ls-remote --exit-code --heads origin dev >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: dev ブランチのチェックアウト
        if: steps.check-dev.outputs.exists == 'true' || github.ref_name == 'dev'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name == 'dev' && github.sha || 'dev' }}
          path: dev

      - name: dev 用依存関係のインストールとビルド
        if: steps.check-dev.outputs.exists == 'true' || github.ref_name == 'dev'
        working-directory: dev
        run: |
          npm ci
          npm run build

      - name: 公開用ディレクトリへ dev ビルドを配置
        if: steps.check-dev.outputs.exists == 'true' || github.ref_name == 'dev'
        run: |
          mkdir -p _site/dev
          cp -a dev/dist/. _site/dev/

      - name: Pages アーティファクトのアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: GitHub Pages へのデプロイ実行
        id: deployment
        uses: actions/deploy-pages@v4
