name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

# GitHub Pages へのデプロイ権限を設定
permissions:
  contents: read
  pages: write
  id-token: write

# 同時デプロイの競合を防止
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Node.js のセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 依存関係のインストール
        run: npm ci

      - name: プロジェクトのビルド
        run: npm run build

      - name: Pages アーティファクトのアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: GitHub Pages へのデプロイ実行
        id: deployment
        uses: actions/deploy-pages@v4
