name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
      - main
      - 'deploy/dev*'
  workflow_dispatch:

# GitHub Pages へのデプロイおよび gh-pages 保管ブランチ更新の権限を設定
permissions:
  contents: write
  pages: write
  id-token: write

# 同時デプロイの競合を防止
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: プッシュされたブランチのチェックアウト
        uses: actions/checkout@v4
        with:
          path: src

      - name: Node.js のセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: src/package-lock.json

      - name: 依存関係のインストールとビルド
        working-directory: src
        run: |
          npm ci
          npm run build

      - name: 既存の gh-pages 保管ブランチの存在確認
        id: check-gh-pages
        working-directory: src
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 既存の公開ファイルを取得（gh-pages ブランチ）
        if: steps.check-gh-pages.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: _site

      - name: 初回用 _site ディレクトリの初期化
        if: steps.check-gh-pages.outputs.exists != 'true'
        run: |
          mkdir -p _site
          git -C _site init
          git -C _site remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

      - name: 該当環境のみビルド結果を反映
        run: |
          if [[ "${GITHUB_REF_NAME}" == deploy/dev* ]]; then
            target_dir="${GITHUB_REF_NAME#deploy/}"
            echo "=== Updating /${target_dir} only ==="
            rm -rf "_site/${target_dir}"
            mkdir -p "_site/${target_dir}"
            cp -a src/dist/. "_site/${target_dir}/"
          else
            echo "=== Updating root (/) only ==="
            find _site -maxdepth 1 ! -path _site ! -name '.git' ! -name 'dev*' -exec rm -rf {} +
            cp -a src/dist/. _site/
          fi

      - name: 初回ルート未構築時の本番ブランチ補完チェック
        id: check-root
        run: |
          if [ ! -f "_site/index.html" ]; then
            echo "missing=true" >> "$GITHUB_OUTPUT"
          else
            echo "missing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 本番ブランチのチェックアウト（初回補完用）
        if: steps.check-root.outputs.missing == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: prod

      - name: 本番ブランチのビルドとルート配置（初回補完用）
        if: steps.check-root.outputs.missing == 'true'
        run: |
          cd prod
          npm ci
          npm run build
          cd ..
          cp -a prod/dist/. _site/

      - name: gh-pages ブランチを更新して保管
        working-directory: _site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages-latest
          git add -A
          git commit -m "deploy: ${GITHUB_REF_NAME} (${GITHUB_SHA::7})"
          git push --force origin gh-pages-latest:gh-pages
          rm -rf .git

      - name: Pages アーティファクトのアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: GitHub Pages へのデプロイ実行
        id: deployment
        uses: actions/deploy-pages@v4
