name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
      - main
      - deploy/dev1
      - deploy/dev2
      - deploy/dev3
  workflow_dispatch:

# GitHub Pages へのデプロイ権限を設定
permissions:
  contents: read
  pages: write
  id-token: write

# 同時デプロイの競合を防止
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 本番ブランチのチェックアウト
        uses: actions/checkout@v4
        with:
          ref: ${{ (github.ref_name == 'master' || github.ref_name == 'main') && github.sha || github.event.repository.default_branch }}
          path: prod

      - name: Node.js のセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: prod/package-lock.json

      - name: 本番用依存関係のインストールとビルド
        working-directory: prod
        run: |
          npm ci
          npm run build

      - name: 公開用ディレクトリへ本番ビルドを配置
        run: |
          mkdir -p _site
          cp -a prod/dist/. _site/

      - name: deploy/dev1 〜 deploy/dev3 のチェックアウトとビルド
        working-directory: prod
        run: |
          for env in dev1 dev2 dev3; do
            branch="deploy/${env}"
            if [ "${GITHUB_REF_NAME}" = "${branch}" ]; then
              echo "=== Building ${branch} (current push: ${GITHUB_SHA}) ==="
              git fetch --depth=1 origin "${GITHUB_SHA}"
              target_ref="${GITHUB_SHA}"
            elif git ls-remote --exit-code --heads origin "${branch}" >/dev/null 2>&1; then
              echo "=== Building ${branch} (from origin) ==="
              git fetch --depth=1 origin "refs/heads/${branch}:refs/remotes/origin/${branch}"
              target_ref="origin/${branch}"
            else
              echo "=== Skipping ${branch} (branch does not exist on origin) ==="
              continue
            fi

            git worktree add --detach "../${env}" "${target_ref}"
            (
              cd "../${env}"
              npm ci
              npm run build
            )
            mkdir -p "../_site/${env}"
            cp -a "../${env}/dist/." "../_site/${env}/"
            git worktree remove --force "../${env}"
          done

      - name: Pages アーティファクトのアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: GitHub Pages へのデプロイ実行
        id: deployment
        uses: actions/deploy-pages@v4
